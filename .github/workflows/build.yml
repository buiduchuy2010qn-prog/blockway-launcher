name: Build BlockWay Launcher Windows & Linux

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'google*.html'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Read package.json version
        id: pkg
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Clean install dependencies (Reproducible lockfile)
        run: npm ci

      - name: Run automated syntax, security & smoke tests
        run: npm test

      - name: Build Windows Setup & Portable EXE
        if: github.event_name != 'pull_request'
        run: npm run dist:win

      - name: Upload Windows Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: BlockWay-Windows-v${{ steps.pkg.outputs.version }}
          path: |
            dist/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Read package.json version
        id: pkg
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Clean install dependencies (Reproducible lockfile)
        run: npm ci

      - name: Run automated syntax, security & smoke tests
        run: npm test

      - name: Build Linux AppImage & DEB
        if: github.event_name != 'pull_request'
        run: npm run dist:linux

      - name: Upload Linux Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: BlockWay-Linux-v${{ steps.pkg.outputs.version }}
          path: |
            dist/*.AppImage
            dist/*.deb

  publish-release:
    if: github.event_name != 'pull_request'
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository for release notes
        uses: actions/checkout@v4

      - name: Build release notes from ota-manifest.json
        id: notes
        run: |
          node << 'EOF'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
          const ota = JSON.parse(fs.readFileSync('./ota-manifest.json', 'utf8'));
          const body = [
            '### 📦 BlockWay Launcher v' + pkg.version + ' PRO — Every World, One Place (Windows & Linux)',
            '',
            '- **📝 Điểm mới bản này:** ' + (ota.notes || pkg.description),
            '- **🦀 8 Core Loaders (Java & Native Horizon Rust):** Hỗ trợ đầy đủ Vanilla, OptiFine, Fabric, Forge, NeoForge, Quilt, Legacy Fabric và **Horizon Rust** (Vulkan / DirectX 12, kho `.hmod` & `.hshader` WGSL chính thức, tự kiểm định tương thích trước khi cài).',
            '- **🔒 Kiến trúc Bảo mật & Cập nhật OTA SHA-256:** Electron `contextIsolation` + `sandbox`, xác thực nguồn gọi IPC, mã hóa token tài khoản qua `safeStorage` (DPAPI / Keyring) và cập nhật delta OTA kiểm định SHA-256 kèm rollback nguyên tử.',
            '- **🐧 Hỗ trợ Windows (`.exe` Setup / Portable) & Linux (`.AppImage` / `.deb`):** Quy trình build tái lập `npm ci` + kiểm thử tự động `npm test`.'
          ].join('\n');
          fs.writeFileSync('RELEASE_BODY.md', body, 'utf8');
          EOF

      - name: Download Windows & Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true

      - name: Publish GitHub Release v${{ needs.build-windows.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-windows.outputs.version }}
          name: "BlockWay Launcher v${{ needs.build-windows.outputs.version }} PRO - Windows & Linux"
          body_path: RELEASE_BODY.md
          files: |
            release-dist/*.exe
            release-dist/*.AppImage
            release-dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
